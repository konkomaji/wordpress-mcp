<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="WordPress MCP logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8fc0"/>
      <stop offset="1" stop-color="#5b6cf0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <rect x="20" y="20" width="180" height="180" rx="42" fill="url(#tile)"/>
    <!-- protocol brackets: any client, one endpoint -->
    <path d="M58 78 L36 110 L58 142 M162 78 L184 110 L162 142" fill="none" stroke="#cfd5ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the W: WordPress -->
    <path d="M66 82 L88 140 L110 100 L132 140 L154 82" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
