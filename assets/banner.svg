<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="WordPress MCP — built exclusively for Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1814"/>
      <stop offset="1" stop-color="#2a211a"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8917a"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa3c9"/>
      <stop offset="1" stop-color="#21759b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>

  <!-- glow accents -->
  <circle cx="1150" cy="40" r="180" fill="#d97757" opacity="0.08"/>
  <circle cx="120" cy="320" r="160" fill="#21759b" opacity="0.10"/>

  <!-- mark -->
  <g transform="translate(96,90)" filter="url(#soft)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#wp)"/>
    <!-- stylized W -->
    <path d="M28 44 L52 120 L72 70 L92 120 L116 44" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Claude spark -->
    <g transform="translate(118,18)">
      <circle r="26" fill="url(#coral)"/>
      <g stroke="#fff" stroke-width="3.4" stroke-linecap="round">
        <line x1="0" y1="-13" x2="0" y2="13"/>
        <line x1="-13" y1="0" x2="13" y2="0"/>
        <line x1="-9" y1="-9" x2="9" y2="9"/>
        <line x1="-9" y1="9" x2="9" y2="-9"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(300,128)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">WordPress <tspan fill="url(#coral)">MCP</tspan></text>
    <text x="2" y="46" font-size="27" font-weight="500" fill="#cdbcae">Let Claude run your WordPress SEO · AEO · GEO — over one secure endpoint.</text>
  </g>

  <!-- exclusively-for-claude pill -->
  <g transform="translate(302,232)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="318" height="46" rx="23" fill="#d97757" opacity="0.16"/>
    <g transform="translate(24,23)">
      <circle r="11" fill="url(#coral)"/>
      <g stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <line x1="0" y1="-6" x2="0" y2="6"/>
        <line x1="-6" y1="0" x2="6" y2="0"/>
        <line x1="-4" y1="-4" x2="4" y2="4"/>
        <line x1="-4" y1="4" x2="4" y2="-4"/>
      </g>
    </g>
    <text x="46" y="30" font-size="20" font-weight="700" fill="#e8917a" letter-spacing="0.5">BUILT EXCLUSIVELY FOR CLAUDE</text>
  </g>
</svg>
